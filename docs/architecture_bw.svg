<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 z" fill="#111"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 z" fill="#666"/>
    </marker>
  </defs>

  <style>
    text { font-family: Arial, 'Noto Sans KR', sans-serif; fill: #111; }
    .title { font-size: 30px; font-weight: 700; }
    .label { font-size: 21px; font-weight: 700; }
    .small { font-size: 16px; }
    .tiny { font-size: 14px; }
    .box { fill: #fff; stroke: #111; stroke-width: 2; rx: 6; }
    .soft { fill: #f6f6f6; stroke: #111; stroke-width: 2; rx: 6; }
    .macro { fill: #ececec; stroke: #111; stroke-width: 2.5; rx: 6; }
    .line { fill: none; stroke: #111; stroke-width: 2.5; marker-end: url(#arrow); }
    .bidir { fill: none; stroke: #111; stroke-width: 2.5; marker-start: url(#arrow); marker-end: url(#arrow); }
    .gray { fill: none; stroke: #666; stroke-width: 2; stroke-dasharray: 8 7; marker-end: url(#arrowGray); }
  </style>

  <rect width="1400" height="760" fill="#fff"/>
  <text x="40" y="48" class="title">LEGv8 SoC Architecture (soc_top)</text>

  <!-- External loading path -->
  <rect x="40" y="110" width="170" height="78" class="soft"/>
  <text x="125" y="140" text-anchor="middle" class="label">External Stream</text>
  <text x="125" y="165" text-anchor="middle" class="small">IMEM / DMEM image</text>

  <rect x="270" y="110" width="150" height="78" class="soft"/>
  <text x="345" y="140" text-anchor="middle" class="label">FIFO</text>
  <text x="345" y="165" text-anchor="middle" class="small">130-bit, depth 4</text>

  <rect x="480" y="110" width="170" height="78" class="soft"/>
  <text x="565" y="140" text-anchor="middle" class="label">Memory Loader</text>
  <text x="565" y="165" text-anchor="middle" class="small">target: IMEM / DMEM</text>

  <path d="M210 149 L270 149" class="line"/>
  <path d="M420 149 L480 149" class="line"/>

  <!-- CPU -->
  <rect x="90" y="305" width="280" height="180" class="box"/>
  <text x="230" y="355" text-anchor="middle" class="label">LEGv8 Core</text>
  <text x="230" y="385" text-anchor="middle" class="small">5-stage pipeline</text>
  <text x="230" y="415" text-anchor="middle" class="small">IF / ID / EX / MEM / WB</text>
  <text x="230" y="447" text-anchor="middle" class="tiny">Hazard · Forwarding · Branch Flush</text>

  <!-- IMEM -->
  <rect x="505" y="270" width="220" height="150" class="macro"/>
  <text x="615" y="315" text-anchor="middle" class="label">Instruction SRAM</text>
  <text x="615" y="345" text-anchor="middle" class="small">32-bit macro ×1</text>
  <text x="615" y="375" text-anchor="middle" class="tiny">Port0: Loader / Port1: CPU IF</text>

  <!-- AHB -->
  <rect x="505" y="500" width="220" height="120" class="box"/>
  <text x="615" y="540" text-anchor="middle" class="label">AHB-Lite</text>
  <text x="615" y="570" text-anchor="middle" class="small">Master + Fabric</text>
  <text x="615" y="596" text-anchor="middle" class="tiny">CPU load/store data path</text>

  <!-- DMEM -->
  <rect x="890" y="285" width="230" height="135" class="macro"/>
  <text x="1005" y="327" text-anchor="middle" class="label">Data SRAM</text>
  <text x="1005" y="357" text-anchor="middle" class="small">32-bit macro ×2</text>
  <text x="1005" y="387" text-anchor="middle" class="tiny">LOW + HIGH = logical 64-bit DMEM</text>

  <!-- MMIO -->
  <rect x="890" y="500" width="230" height="120" class="box"/>
  <text x="1005" y="540" text-anchor="middle" class="label">MMIO</text>
  <text x="1005" y="570" text-anchor="middle" class="small">GPIO / UART FIFO</text>
  <text x="1005" y="596" text-anchor="middle" class="tiny">0x0100 ~ 0x01FF</text>

  <!-- Runtime instruction path -->
  <path d="M370 345 L505 345" class="bidir"/>
  <text x="438" y="326" text-anchor="middle" class="tiny">Dedicated IMEM req/rsp</text>

  <!-- Runtime data path -->
  <path d="M370 445 L435 445 L435 560 L505 560" class="bidir"/>
  <text x="430" y="474" text-anchor="middle" class="tiny">Load / Store</text>

  <!-- Fabric backends -->
  <path d="M725 540 L805 540 L805 355 L890 355" class="line"/>
  <text x="805" y="335" text-anchor="middle" class="tiny">0x0000 ~ 0x00FF</text>

  <path d="M725 575 L890 575" class="line"/>
  <text x="805" y="557" text-anchor="middle" class="tiny">0x0100 ~ 0x01FF</text>

  <!-- Loader paths -->
  <path d="M565 188 L565 270" class="gray"/>
  <text x="580" y="230" class="tiny">IMEM program</text>

  <path d="M650 149 L790 149 L790 470 L615 470 L615 500" class="gray"/>
  <text x="805" y="180" class="tiny">DMEM load via AHB-Lite</text>

  <!-- load_done -->
  <path d="M480 175 L425 175 L425 270 L230 270 L230 305" class="gray"/>
  <text x="327" y="255" text-anchor="middle" class="tiny">load_done → core reset release</text>

  <!-- Note -->
  <rect x="1160" y="270" width="200" height="350" class="soft"/>
  <text x="1260" y="310" text-anchor="middle" class="label">Key Points</text>
  <text x="1180" y="352" class="small">• Harvard-style I/D path</text>
  <text x="1180" y="392" class="small">• IMEM: dedicated req/rsp</text>
  <text x="1180" y="432" class="small">• D-side: AHB-Lite</text>
  <text x="1180" y="472" class="small">• SRAM hard macro ×3</text>
  <text x="1180" y="512" class="small">• GPIO / UART MMIO</text>
  <text x="1180" y="552" class="small">• Loader is verification</text>
  <text x="1180" y="578" class="small">  infrastructure</text>

  <text x="40" y="705" class="small">Physical Design target: Sky130 / OpenLane · Core logic + 3 SRAM hard macros + AHB-Lite + MMIO</text>
</svg>
