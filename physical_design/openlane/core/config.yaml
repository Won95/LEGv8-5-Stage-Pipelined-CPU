# =============================================================================
# LEGv8 core - OpenLane 2 Classic flow master configuration
# =============================================================================
# IMPORTANT
# - This YAML file is the human-editable master config from now on.
# - YAML is used because OpenLane JSON must be pure ECMA-404 JSON and therefore
#   cannot contain comments.
# - Run with:  openlane --flow Classic config.yaml
# - Values marked [PDK] are normally supplied by sky130A / sky130_fd_sc_hd.
#   They are intentionally left commented so we do not accidentally override
#   correct PDK technology values.
# - "null" means: let OpenLane/PDK choose the default unless we explicitly tune it.
# =============================================================================

# =============================================================================
# 00. DESIGN / CLOCK / INPUTS
# =============================================================================
DESIGN_NAME: core_pd_top                  # Top module passed to the PnR flow.
PDK: sky130A                              # Process design kit.
# STD_CELL_LIBRARY: sky130_fd_sc_hd       # [PDK] Normally selected by the PDK/default.

VERILOG_FILES:                            # RTL compiled by Yosys.
  - dir::./core_pd_top.sv
  - dir::../../../rtl/alu.sv
  - dir::../../../rtl/control.sv
  - dir::../../../rtl/core.sv
  - dir::../../../rtl/datapath.sv
  - dir::../../../rtl/forwarding_unit.sv
  - dir::../../../rtl/hazard_detection_unit.sv
  - dir::../../../rtl/program_counter.sv
  - dir::../../../rtl/register_file.sv
  - dir::../../../rtl/sign_extension.sv
VERILOG_DEFINES: null                     # Optional Verilog preprocessor defines.
VERILOG_INCLUDE_DIRS: null                # Optional `include search paths.
VERILOG_POWER_DEFINE: USE_POWER_PINS      # Define used to guard power pins.
SYNTH_PARAMETERS: null                    # Optional Yosys chparam key=value list.

CLOCK_PORT: clk                           # Primary clock port.
CLOCK_PERIOD: 7                           # Target period in ns.
PNR_SDC_FILE: dir::./top.con              # Constraints for implementation stages.
SIGNOFF_SDC_FILE: dir::./top.con          # Constraints for post-route/signoff STA.

# =============================================================================
# 01. CLASSIC FLOW STEP ENABLES
# These switches expose every optional Classic-flow block so we can toggle a
# stage directly without hunting through documentation.
# =============================================================================
RUN_LINTER: true                          # Run Verilator lint and lint checkers.
RUN_EQY: false                            # Run Yosys formal equivalence checking.
RUN_TAP_ENDCAP_INSERTION: true            # Insert tap/endcap cells.
RUN_POST_GPL_DESIGN_REPAIR: true          # Repair slew/cap/fanout after global placement.
RUN_POST_GRT_DESIGN_REPAIR: false         # Experimental repair after global routing.
RUN_CTS: true                             # Clock-tree synthesis.
RUN_POST_CTS_RESIZER_TIMING: true         # Setup/hold resizer pass after CTS.
RUN_POST_GRT_RESIZER_TIMING: false        # Experimental timing repair after global routing.
RUN_HEURISTIC_DIODE_INSERTION: false      # Heuristic antenna diode insertion.
RUN_ANTENNA_REPAIR: true                  # OpenROAD antenna repair after global route.
RUN_DRT: true                             # Detailed routing.
RUN_FILL_INSERTION: true                  # Filler/decap insertion.
RUN_MCSTA: true                           # Multi-corner post-PnR STA.
RUN_SPEF_EXTRACTION: true                 # RC extraction / SPEF generation.
RUN_IRDROP_REPORT: true                   # Static IR-drop report.
RUN_LVS: true                             # Netgen LVS.
RUN_MAGIC_STREAMOUT: true                 # Magic GDS stream-out.
RUN_KLAYOUT_STREAMOUT: true               # KLayout GDS stream-out.
RUN_MAGIC_WRITE_LEF: true                 # Magic LEF generation.
RUN_KLAYOUT_XOR: true                     # Compare Magic and KLayout GDS outputs.
RUN_MAGIC_DRC: true                       # Magic DRC.
RUN_KLAYOUT_DRC: true                     # KLayout DRC.

# =============================================================================
# 02. CHECKERS / LINT POLICY
# =============================================================================
ERROR_ON_LINTER_ERRORS: true              # Abort on lint errors.
ERROR_ON_LINTER_WARNINGS: false           # Warnings are reported but do not abort.
ERROR_ON_LINTER_TIMING_CONSTRUCTS: true   # Abort on unsupported timing constructs.
ERROR_ON_SYNTH_CHECKS: true               # Abort on Yosys loops / undriven nets.
ERROR_ON_UNMAPPED_CELLS: true             # Abort if synthesis leaves unmapped cells.
ERROR_ON_NL_ASSIGN_STATEMENTS: true       # Reject assign statements in mapped netlist.
ERROR_ON_DISCONNECTED_PINS: true          # Abort on critical disconnected pins.
ERROR_ON_TR_DRC: true                     # Routing DRC checker.
ERROR_ON_LONG_WIRE: true                  # Long-wire checker.
ERROR_ON_PDN_VIOLATIONS: true             # Power-grid violation checker.
ERROR_ON_LVS_ERROR: true                  # LVS checker.
ERROR_ON_MAGIC_DRC: true                  # Magic DRC checker.
ERROR_ON_KLAYOUT_DRC: true                # KLayout DRC checker.
ERROR_ON_ILLEGAL_OVERLAPS: true           # Magic extraction overlap checker.
ERROR_ON_XOR_ERROR: true                  # Magic/KLayout XOR checker.

# Timing-check corner filters. null -> use PDK-defined timing violation corners.
SETUP_VIOLATION_CORNERS: null
HOLD_VIOLATION_CORNERS: null
MAX_SLEW_VIOLATION_CORNERS: null
MAX_CAP_VIOLATION_CORNERS: null

# =============================================================================
# 03. YOSYS / ABC SYNTHESIS
# =============================================================================
YOSYS_LOG_LEVEL: ALL                      # ALL / WARNING / ERROR.
SYNTH_CHECKS_ALLOW_TRISTATE: true         # Ignore valid tri-state multi-driver cases.
SYNTH_AUTONAME: false                     # Human-readable but very long synthesized names.
SYNTH_STRATEGY: "AREA 0"                 # AREA 0..3 / DELAY 0..4. DELAY 0 was bad here.
SYNTH_ABC_BUFFERING: true                 # Allow ABC buffering during mapping.
SYNTH_ABC_LEGACY_REFACTOR: false          # Use legacy ABC refactor behavior.
SYNTH_ABC_LEGACY_REWRITE: false           # Use legacy ABC rewrite behavior.
SYNTH_ABC_DFF: false                      # Allow ABC sequential/DFF optimization.
SYNTH_ABC_USE_MFS3: false                 # Experimental SAT-based remapping.
SYNTH_ABC_AREA_USE_NF: false              # Experimental alternate area mapper.
SYNTH_DIRECT_WIRE_BUFFERING: true         # Buffer direct wire-to-wire connections.
SYNTH_SPLITNETS: true                     # Split buses into scalar nets in mapped netlist.
SYNTH_SIZING: false                       # ABC sizing; A/B test produced identical netlist here.
SYNTH_HIERARCHY_MODE: flatten             # flatten / deferred_flatten / keep.
SYNTH_SHARE_RESOURCES: true               # Merge shareable arithmetic/logic resources.
SYNTH_ADDER_TYPE: YOSYS                   # YOSYS / FA / RCA / CSA.
SYNTH_EXTRA_MAPPING_FILE: null            # Optional custom techmap file.
SYNTH_ELABORATE_ONLY: false               # Stop at elaboration for structural netlists.
SYNTH_ELABORATE_FLATTEN: true             # Flatten when elaborate-only is enabled.
SYNTH_MUL_BOOTH: false                    # Enable Yosys Booth multiplier pass.
SYNTH_TIE_UNDEFINED: low                  # Tie X/undefined low/high; null leaves undriven.
SYNTH_WRITE_NOATTR: true                  # Strip Verilog attributes from output netlist.
USE_LIGHTER: false                        # Experimental clock-gated FF optimization plugin.
LIGHTER_DFF_MAP: null                     # Optional custom Lighter DFF map.
USE_SYNLIG: false                         # Alternative SystemVerilog frontend.
SYNLIG_DEFER: false                       # Experimental deferred Synlig parsing.

# [PDK] Mapping files. Leave to sky130A unless intentionally overriding.
# SYNTH_LATCH_MAP: null
# SYNTH_TRISTATE_MAP: null
# SYNTH_CSA_MAP: null
# SYNTH_RCA_MAP: null
# SYNTH_FA_MAP: null
# SYNTH_MUX_MAP: null
# SYNTH_MUX4_MAP: null

# =============================================================================
# 04. FLOORPLAN
# =============================================================================
FP_SIZING: relative                       # relative = derive die from utilization; absolute = use DIE/CORE_AREA.
FP_ASPECT_RATIO: 1.0                      # Core height / width.
FP_CORE_UTIL: 35                          # % cell utilization target. Lower = larger/less congested core.
CORE_AREA: null                           # Explicit x0,y0,x1,y1 core box; pair with DIE_AREA.
DIE_AREA: null                            # Explicit x0,y0,x1,y1 die box for absolute sizing.
BOTTOM_MARGIN_MULT: 4                     # Bottom core-to-die margin in site-height multiples.
TOP_MARGIN_MULT: 4                        # Top margin in site-height multiples.
LEFT_MARGIN_MULT: 12                      # Left margin in site-width multiples.
RIGHT_MARGIN_MULT: 12                     # Right margin in site-width multiples.
FP_OBSTRUCTIONS: null                     # Hard floorplan placement obstructions.
PL_SOFT_OBSTRUCTIONS: null                # Soft blockages usable later by CTS/buffer insertion.
FP_DEF_TEMPLATE: null                     # Optional DEF template.

# [PDK] Alternate placement sites, normally not overridden.
# EXTRA_SITES: null

# =============================================================================
# 05. TAP / ENDCAP / MACRO ROW CUTTING
# =============================================================================
FP_MACRO_HORIZONTAL_HALO: 10              # Row-cut halo around hard macros (µm).
FP_MACRO_VERTICAL_HALO: 10                # Row-cut halo around hard macros (µm).
PL_MACRO_HALO: "0 0"                     # Macro placement halo: horizontal vertical (µm).
PL_MACRO_CHANNEL: "0 0"                  # Requested channel between macros (µm).

# =============================================================================
# 06. POWER DISTRIBUTION NETWORK (PDN)
# =============================================================================
PDN_CONNECT_MACROS_TO_GRID: true          # Connect macro PG pins to top-level PDN.
PDN_MACRO_CONNECTIONS: null               # Explicit macro PG connection rules.
PDN_ENABLE_GLOBAL_CONNECTIONS: true       # Create global VDD/GND connections.
FP_PDN_CFG: null                          # Optional custom pdngen Tcl/config.
FP_PDN_SKIPTRIM: false                    # Skip trimming dangling PDN metal stubs.
FP_PDN_CORE_RING: false                   # Add a power ring around core.
FP_PDN_ENABLE_RAILS: true                 # Add standard-cell rails.
FP_PDN_HORIZONTAL_HALO: 10                # Horizontal PDN halo around macros (µm).
FP_PDN_VERTICAL_HALO: 10                  # Vertical PDN halo around macros (µm).
FP_PDN_MULTILAYER: true                   # Use multi-layer PDN straps.

# [PDK] Geometry defaults supplied by sky130A. Uncomment only for deliberate PDN tuning.
# FP_PDN_RAIL_OFFSET: <PDK default>
# FP_PDN_VWIDTH: <PDK default>
# FP_PDN_HWIDTH: <PDK default>
# FP_PDN_VSPACING: <PDK default>
# FP_PDN_HSPACING: <PDK default>
# FP_PDN_VPITCH: <PDK default>
# FP_PDN_HPITCH: <PDK default>
# FP_PDN_VOFFSET: <PDK default>
# FP_PDN_HOFFSET: <PDK default>
# FP_PDN_CORE_RING_VWIDTH: <PDK default>
# FP_PDN_CORE_RING_HWIDTH: <PDK default>
# FP_PDN_CORE_RING_VSPACING: <PDK default>
# FP_PDN_CORE_RING_HSPACING: <PDK default>
# FP_PDN_CORE_RING_VOFFSET: <PDK default>
# FP_PDN_CORE_RING_HOFFSET: <PDK default>
# FP_PDN_RAIL_LAYER: <PDK default>
# FP_PDN_RAIL_WIDTH: <PDK default>
# FP_PDN_HORIZONTAL_LAYER: <PDK default>
# FP_PDN_VERTICAL_LAYER: <PDK default>

# =============================================================================
# 07. I/O PIN PLACEMENT
# =============================================================================
FP_IO_VEXTEND: 0                          # Vertical-pin extension beyond die (µm).
FP_IO_HEXTEND: 0                          # Horizontal-pin extension beyond die (µm).
FP_IO_VTHICKNESS_MULT: 2                  # Vertical pin thickness multiplier.
FP_IO_HTHICKNESS_MULT: 2                  # Horizontal pin thickness multiplier.
FP_PPL_MODE: matching                     # matching / random_equidistant / annealing.
FP_PIN_ORDER_CFG: null                    # Optional custom pin-order configuration.
# FP_IO_MIN_DISTANCE: <PDK default>        # [PDK] Minimum distance between pins.
# FP_IO_VLENGTH: <PDK default>             # [PDK] North/south pin length.
# FP_IO_HLENGTH: <PDK default>             # [PDK] East/west pin length.

# =============================================================================
# 08. GLOBAL PLACEMENT
# =============================================================================
PL_TARGET_DENSITY_PCT: 45                 # Target placement density. Lower -> more whitespace/routability.
PL_SKIP_INITIAL_PLACEMENT: false           # Skip initial placement phase.
PL_WIRE_LENGTH_COEF: 0.25                 # Initial wirelength coefficient.
PL_MIN_PHI_COEFFICIENT: null              # Lower bound for GPL mu_k if placement diverges.
PL_MAX_PHI_COEFFICIENT: null              # Upper bound for GPL mu_k if placement diverges.
PL_TIME_DRIVEN: true                      # Timing-driven global placement.
PL_ROUTABILITY_DRIVEN: true               # Congestion/routability-driven placement.
# GPL_CELL_PADDING: <PDK default>          # [PDK] Global-placement cell padding in sites.

# =============================================================================
# 09. DETAILED PLACEMENT / LEGALIZATION
# =============================================================================
PL_OPTIMIZE_MIRRORING: true               # Mirror cells when legal and beneficial.
PL_MAX_DISPLACEMENT_X: 500                # Max legalization move in X (µm).
PL_MAX_DISPLACEMENT_Y: 100                # Max legalization move in Y (µm).
# DPL_CELL_PADDING: <PDK default>          # [PDK] Detailed-placement padding in sites.

# =============================================================================
# 10. POST-GLOBAL-PLACEMENT DESIGN REPAIR
# repair_design: slew, capacitance, fanout and optional long-wire buffering.
# =============================================================================
DESIGN_REPAIR_BUFFER_INPUT_PORTS: true    # Buffer input ports during design repair.
DESIGN_REPAIR_BUFFER_OUTPUT_PORTS: true   # Buffer output ports during design repair.
DESIGN_REPAIR_TIE_SEPARATION: false       # Separate tie fanout using additional tie cells.
DESIGN_REPAIR_MAX_WIRE_LENGTH: 0          # 0 disables long-wire-length buffer cap.
DESIGN_REPAIR_MAX_SLEW_PCT: 20            # Slew margin used by repair_design (%).
DESIGN_REPAIR_MAX_CAP_PCT: 20             # Capacitance margin used by repair_design (%).
DESIGN_REPAIR_REMOVE_BUFFERS: false        # Remove synth buffers first so OpenROAD can rebuffer.

# Shared resizer controls.
RSZ_DONT_TOUCH_RX: "$^"                  # Regex of nets/instances the resizer must not touch.
RSZ_DONT_TOUCH_LIST: null                 # Explicit don't-touch names.
RSZ_CORNERS: null                         # null -> use PDK STA corners.

# =============================================================================
# 11. CLOCK TREE SYNTHESIS
# =============================================================================
CTS_SINK_CLUSTERING_SIZE: 25              # Maximum sinks per CTS cluster.
CTS_SINK_CLUSTERING_MAX_DIAMETER: 50      # Maximum cluster diameter (µm).
CTS_CLK_MAX_WIRE_LENGTH: 0                # 0 = no explicit clock max-wire limit.
CTS_DISABLE_POST_PROCESSING: false         # Keep CTS outlier-sink post processing enabled.
CTS_DISTANCE_BETWEEN_BUFFERS: 0           # Explicit clock-buffer spacing; 0 = tool choice.
CTS_CORNERS: null                         # null -> use STA_CORNERS from PDK.
# CTS_ROOT_BUFFER: <PDK default>           # [PDK] Clock root buffer cell.
# CTS_CLK_BUFFERS: <PDK default>           # [PDK] Legal CTS buffer cells.

# Clock routing layer overrides. null -> PDK/router defaults.
RT_CLOCK_MIN_LAYER: null
RT_CLOCK_MAX_LAYER: null

# =============================================================================
# 12. POST-CTS TIMING RESIZER
# This is where OpenROAD automatically upsizes/downsizes/clones/inserts buffers.
# =============================================================================
PL_RESIZER_HOLD_SLACK_MARGIN: 0.10         # Over-fix hold by this many ns.
PL_RESIZER_SETUP_SLACK_MARGIN: 0.05        # Setup margin target in ns.
PL_RESIZER_HOLD_MAX_BUFFER_PCT: 50         # Max hold buffers as % of design instances.
PL_RESIZER_SETUP_MAX_BUFFER_PCT: 50        # Max setup buffers as % of design instances.
PL_RESIZER_ALLOW_SETUP_VIOS: false         # Do not create setup violations while fixing hold.
PL_RESIZER_GATE_CLONING: true              # Clone high-fanout gates for setup recovery.
PL_RESIZER_FIX_HOLD_FIRST: false           # Experimental hold-first optimization ordering.

# =============================================================================
# 13. GLOBAL ROUTING
# =============================================================================
GRT_ADJUSTMENT: 0.30                      # Capacity reduction; larger = more conservative routing.
GRT_MACRO_EXTENSION: 0                    # Extend macro blockages by N GCells.
GRT_ALLOW_CONGESTION: false               # Fail rather than hiding unresolved congestion.
GRT_ANTENNA_ITERS: 3                      # Maximum antenna-repair global-route iterations.
GRT_OVERFLOW_ITERS: 100                   # Iterations allowed for overflow/congestion convergence.
GRT_ANTENNA_MARGIN: 10                    # Antenna over-fix margin (%).
DIODE_PADDING: null                       # Optional diode placement padding in sites.
# GRT_LAYER_ADJUSTMENTS: <PDK default>     # [PDK] Per-routing-layer capacity reductions.

# General signal routing layer overrides. null -> PDK defaults.
RT_MIN_LAYER: null
RT_MAX_LAYER: null

# =============================================================================
# 14. POST-GLOBAL-ROUTING DESIGN REPAIR
# =============================================================================
GRT_DESIGN_REPAIR_RUN_GRT: true           # Re-run global route around repair_design.
GRT_DESIGN_REPAIR_MAX_WIRE_LENGTH: 0      # 0 = no explicit long-wire threshold.
GRT_DESIGN_REPAIR_MAX_SLEW_PCT: 10        # Post-GRT slew margin (%).
GRT_DESIGN_REPAIR_MAX_CAP_PCT: 10         # Post-GRT capacitance margin (%).

# =============================================================================
# 15. POST-GLOBAL-ROUTING TIMING RESIZER
# =============================================================================
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.05        # Hold target margin (ns).
GRT_RESIZER_SETUP_SLACK_MARGIN: 0.025      # Setup target margin (ns).
GRT_RESIZER_HOLD_MAX_BUFFER_PCT: 50        # Hold buffer budget (% of instances).
GRT_RESIZER_SETUP_MAX_BUFFER_PCT: 50       # Setup buffer budget (% of instances).
GRT_RESIZER_ALLOW_SETUP_VIOS: false        # Prevent new setup vios during hold repair.
GRT_RESIZER_GATE_CLONING: true             # Allow cloning for setup recovery.
GRT_RESIZER_RUN_GRT: true                  # Re-run global route after timing changes.
GRT_RESIZER_FIX_HOLD_FIRST: false          # Experimental hold-first ordering.

# =============================================================================
# 16. DETAILED ROUTING
# =============================================================================
DRT_THREADS: null                         # null -> use machine thread count.
DRT_MIN_LAYER: null                       # Optional detailed-route minimum layer override.
DRT_MAX_LAYER: null                       # Optional detailed-route maximum layer override.
DRT_OPT_ITERS: 64                         # TritonRoute optimization iteration limit.

# =============================================================================
# 17. STA / TIMING REPORTING
# =============================================================================
STA_MACRO_PRIORITIZE_NL: true             # Prefer macro netlist+SPEF to .lib when both exist.
STA_MAX_VIOLATOR_COUNT: null              # null = do not impose our own violator-list cap.
STA_THREADS: null                         # Parallel STA corner count; null -> machine threads.
EXTRA_SPEFS: null                         # Legacy compatibility only; avoid for new designs.

# =============================================================================
# 18. RC EXTRACTION / SIGNOFF
# Most RCX technology values are PDK-owned; the switches above RUN_SPEF_EXTRACTION
# and RUN_MCSTA control whether extraction and post-PnR STA execute.
# =============================================================================
# RCX_RULESETS: <PDK default>              # [PDK] Extraction rule files/corners.

# =============================================================================
# 19. ANTENNA / ROUTING-RELATED REFERENCE KNOBS
# =============================================================================
# HEURISTIC_ANTENNA_THRESHOLD: <PDK default>  # [PDK] Heuristic diode trigger length.

# =============================================================================
# 20. SIGNOFF / STREAMOUT / DRC / LVS
# Run switches are in section 01. Most technology-specific settings are supplied
# by the PDK, so they are documented here but intentionally not overridden.
# =============================================================================
# MAGIC_DRC_USE_GDS: false                # If supported, choose GDS-based Magic DRC input.
# KLAYOUT_DRC_THREADS: null               # Tool-dependent parallelism, if exposed by this build.

# =============================================================================
# 21. QUICK-TUNE BLOCK FOR THIS CORE
# Change these first during closure experiments; the detailed sections above
# remain the canonical definitions and explain what each one does.
# =============================================================================
# Congestion too high:
#   FP_CORE_UTIL:           35 -> 30 -> 25       (larger core)
#   PL_TARGET_DENSITY_PCT:  45 -> 40 -> 35       (more whitespace)
#   GRT_ADJUSTMENT:         0.30 -> 0.25 -> 0.20 (less conservative capacity model;
#                                                 use only after fixing placement density)
#
# Setup not closed after CTS:
#   PL_RESIZER_SETUP_SLACK_MARGIN: 0.05 -> 0.10
#   PL_RESIZER_SETUP_MAX_BUFFER_PCT: 50 -> 75
#   PL_RESIZER_GATE_CLONING: true
#
# Hold problems:
#   PL_RESIZER_HOLD_SLACK_MARGIN: 0.10
#   PL_RESIZER_HOLD_MAX_BUFFER_PCT: 50
#
# Do NOT randomly switch SYNTH_STRATEGY back to DELAY 0: this design previously
# regressed badly with that strategy.
# =============================================================================
