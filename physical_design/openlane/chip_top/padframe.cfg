# First-pass Padringer-style padframe plan for chip_top.
# AREA is the full die size in microns.
#
# The signal/power bond pads are centered on each side.  SPACE entries are
# intentionally left as physical padframe gaps for now; they are where the
# Sky130 com_bus/connect filler slices will be inserted after the first
# chip-level floorplan is validated.

AREA 2000 2000 ;

CORNER corner_sw SW sky130_ef_io__corner_pad ;
CORNER corner_se SE sky130_ef_io__corner_pad ;
CORNER corner_ne NE sky130_ef_io__corner_pad ;
CORNER corner_nw NW sky130_ef_io__corner_pad ;

# North: 470 um of bond pads, centered in the 1600 um side span.
SPACE 565 ;
PAD io_pads.u_vccd_pad N sky130_ef_io__vccd_lvc_clamped_pad ;
PAD io_pads.u_vssd_pad N sky130_ef_io__vssd_lvc_clamped_pad ;
PAD io_pads.u_clk_pad N sky130_ef_io__gpiov2_pad ;
PAD io_pads.u_rst_pad N sky130_ef_io__gpiov2_pad ;
PAD io_pads.GPIO_PADS[0].u_gpio_pad N sky130_ef_io__gpiov2_pad ;
PAD io_pads.GPIO_PADS[1].u_gpio_pad N sky130_ef_io__gpiov2_pad ;
SPACE 565 ;

# East
SPACE 565 ;
PAD io_pads.u_vddio_pad E sky130_ef_io__vddio_hvc_clamped_pad ;
PAD io_pads.u_vssio_pad E sky130_ef_io__vssio_hvc_clamped_pad ;
PAD io_pads.GPIO_PADS[2].u_gpio_pad E sky130_ef_io__gpiov2_pad ;
PAD io_pads.GPIO_PADS[3].u_gpio_pad E sky130_ef_io__gpiov2_pad ;
PAD io_pads.GPIO_PADS[4].u_gpio_pad E sky130_ef_io__gpiov2_pad ;
PAD io_pads.GPIO_PADS[5].u_gpio_pad E sky130_ef_io__gpiov2_pad ;
SPACE 565 ;

# South
SPACE 565 ;
PAD io_pads.u_vdda_pad S sky130_ef_io__vdda_hvc_clamped_pad ;
PAD io_pads.u_vssa_pad S sky130_ef_io__vssa_hvc_clamped_pad ;
PAD io_pads.GPIO_PADS[6].u_gpio_pad S sky130_ef_io__gpiov2_pad ;
PAD io_pads.GPIO_PADS[7].u_gpio_pad S sky130_ef_io__gpiov2_pad ;
PAD io_pads.GPIO_PADS[8].u_gpio_pad S sky130_ef_io__gpiov2_pad ;
PAD io_pads.GPIO_PADS[9].u_gpio_pad S sky130_ef_io__gpiov2_pad ;
SPACE 565 ;

# West: six 80 um GPIO pads -> 480 um, leaving 560 um at each end.
SPACE 560 ;
PAD io_pads.GPIO_PADS[10].u_gpio_pad W sky130_ef_io__gpiov2_pad ;
PAD io_pads.GPIO_PADS[11].u_gpio_pad W sky130_ef_io__gpiov2_pad ;
PAD io_pads.GPIO_PADS[12].u_gpio_pad W sky130_ef_io__gpiov2_pad ;
PAD io_pads.GPIO_PADS[13].u_gpio_pad W sky130_ef_io__gpiov2_pad ;
PAD io_pads.GPIO_PADS[14].u_gpio_pad W sky130_ef_io__gpiov2_pad ;
PAD io_pads.GPIO_PADS[15].u_gpio_pad W sky130_ef_io__gpiov2_pad ;
SPACE 560 ;
